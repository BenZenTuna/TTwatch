services:
  # Embedder runs on CPU to leave GPU for both vLLM instances.
  # Qwen3-Embedding-0.6B is tiny (0.6B params) and performs well on CPU.
  embedder:
    build: ./services/embedder
    restart: unless-stopped
    ports: ["8101:8001"]
    environment:
      MODEL_NAME: "${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}"
      EMBEDDER_DEVICE: "cpu"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Primary reasoning model — loads FIRST on empty GPU.
  # 0.55 * 32607 = ~18 GB budget. Model weights ~16.5 GB, leaves ~1.5 GB for KV cache.
  # Reduced from 0.65 to prevent CPU-side block swapping when sharing GPU with vllm-fast.
  vllm:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.16.0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    volumes: [./models:/models]
    command: >
      --model /models/${LOCAL_MODEL_NAME:-Qwen3-32B-AWQ}
      --quantization awq_marlin
      --gpu-memory-utilization 0.55
      --max-model-len 8192
      --max-num-seqs 4
      --enable-prefix-caching
      --reasoning-parser deepseek_r1
      --port 8000
    ports: ["8100:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Fast classification model — loads SECOND after vllm is healthy.
  # 0.75 util so cache budget = total*0.75 - all_used > 0 despite vllm's allocation. (Qwen3.5-9B-AWQ)
  # Reduced from 0.85 to leave KV cache headroom and prevent CPU-side block swapping.
  vllm-fast:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.16.0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    volumes: [./models:/models]
    command: >
      --model /models/${FAST_MODEL_NAME:-Qwen3.5-9B-AWQ}
      --quantization awq_marlin
      --gpu-memory-utilization 0.75
      --max-model-len 8192
      --max-num-seqs 8
      --enable-prefix-caching
      --disable-log-requests
      --port 8000
    ports: ["8102:8000"]
    depends_on:
      vllm: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s

  # Override dependencies to include GPU services
  api:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }

  worker-io:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }

  worker-cpu:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }
