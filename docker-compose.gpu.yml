services:
  embedder:
    build: ./services/embedder
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    ports: ["8101:8001"]
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_NAME: "${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  vllm:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.16.0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    volumes: [./models:/models]
    command: >
      --model /models/${LOCAL_MODEL_NAME:-Qwen3-32B-AWQ}
      --quantization awq
      --gpu-memory-utilization 0.55
      --max-model-len 32768
      --max-num-seqs 8
      --enable-prefix-caching
      --reasoning-parser deepseek_r1
      --port 8000
    ports: ["8100:8000"]
    depends_on:
      embedder: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  vllm-fast:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.16.0}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    volumes: [./models:/models]
    command: >
      --model /models/${FAST_MODEL_NAME:-Qwen3-8B-AWQ}
      --quantization awq
      --gpu-memory-utilization 0.30
      --max-model-len 8192
      --max-num-seqs 16
      --enable-prefix-caching
      --disable-log-requests
      --port 8000
    ports: ["8102:8000"]
    depends_on:
      vllm: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Override dependencies to include GPU services
  api:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }

  worker-io:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }

  worker-cpu:
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      vllm: { condition: service_healthy }
      vllm-fast: { condition: service_healthy }
      embedder: { condition: service_healthy }
