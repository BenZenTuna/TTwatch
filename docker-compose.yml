# docker-compose.yml — NO `version:` key (Compose V2 infers spec automatically)

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_DEDUP_URL: redis://redis:6379/2
  REDIS_CACHE_URL: redis://redis:6379/3
  QDRANT_URL: http://qdrant:6333
  VLLM_URL: ${VLLM_URL:-http://vllm:8000/v1}
  EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8001}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  MINIO_URL: ${MINIO_URL:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-ttwatch-content}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-Qwen3-32B-AWQ}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  JWT_SECRET: ${JWT_SECRET}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttwatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.12.1}
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-11-07T00-52-20Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports: ["8888:8080"]
    volumes: [./config/searxng:/etc/searxng]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://ttwatch_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ttwatch}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker-io:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: >
      celery -A worker.celeryconfig worker
      --loglevel=info
      --pool=gevent
      --concurrency=32
      --prefetch-multiplier=1
      -Q ttwatch:default
      -n io-worker@%h
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://ttwatch_worker:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ttwatch}
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celeryconfig inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker-cpu:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: >
      celery -A worker.celeryconfig worker
      --loglevel=info
      --pool=prefork
      --concurrency=2
      --prefetch-multiplier=1
      -Q ttwatch:compute
      -n cpu-worker@%h
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://ttwatch_worker:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ttwatch}
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celeryconfig inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: >
      celery -A worker.celeryconfig beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://ttwatch_worker:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ttwatch}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  redis_data:
  minio_data:
