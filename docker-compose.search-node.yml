# docker-compose.search-node.yml
services:
  searxng:
    image: searxng/searxng:2024.11.17-b17f4d04a
    ports: ["8080:8080"]
    volumes: [./config/searxng:/etc/searxng]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
