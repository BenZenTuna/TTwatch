# docker-compose.search-node.yml
services:
  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    ports: ["8080:8080"]
    volumes: [./config/searxng:/etc/searxng]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
