# docker-compose.gpu-node.yml
# Run on the GPU machine: docker compose -f docker-compose.gpu-node.yml up -d

services:
  embedder:
    build: ./services/embedder
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    ports: ["8001:8001"]
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_NAME: "BAAI/bge-m3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.7.3
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]
    volumes: [./models:/models]
    command: >
      --model /models/Qwen2.5-32B-Instruct-AWQ
      --quantization awq
      --gpu-memory-utilization 0.85
      --max-model-len 32768
      --max-num-seqs 8
      --enable-prefix-caching
      --port 8000
      --host 0.0.0.0
    ports: ["8000:8000"]
    depends_on:
      embedder: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
